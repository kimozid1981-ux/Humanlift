name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: humanlift
          POSTGRES_PASSWORD: humanlift
          POSTGRES_DB: humanlift_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U humanlift" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      APP_ENV: test
      DATABASE_URL: postgresql://humanlift:humanlift@localhost:5432/humanlift_ci
      TEST_DATABASE_URL: postgresql://humanlift:humanlift@localhost:5432/humanlift_ci
      WEB_BASE_URL: http://localhost:3000
      AUTH_RATE_LIMIT: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate a throwaway encryption key for this CI run (not a secret)
        run: echo "MFA_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit (high and critical)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Prisma client
        run: pnpm --filter @humanlift/api exec prisma generate
      - name: Database migrations on an empty database
        run: pnpm --filter @humanlift/api db:migrate
      - name: Seed country configuration
        run: pnpm --filter @humanlift/api db:seed
      - name: Type check
        run: pnpm -r typecheck
      - name: API unit and integration tests
        run: pnpm --filter @humanlift/api test
      - name: Build
        run: pnpm -r build
      - name: Install Playwright browser
        run: pnpm --filter @humanlift/web exec playwright install --with-deps chromium
      - name: End-to-end browser tests
        run: pnpm --filter @humanlift/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
