name: Mobile app

# Android: checked and built on every pull request that touches the app.
# iPhone: built only when started by hand (Actions tab, "Run workflow"),
# because macOS runner minutes cost more. Neither job signs or publishes
# anything: the builds are unsigned test builds, never app-store uploads.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Also build the iPhone app (unsigned, uses macOS minutes)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK (test build, not for the Play Store)
        run: flutter build apk --debug --dart-define=APP_ENVIRONMENT=test
      - uses: actions/upload-artifact@v4
        with:
          name: humanlift-android-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build iPhone app without code signing (cannot be installed on a phone)
        run: flutter build ios --debug --no-codesign --dart-define=APP_ENVIRONMENT=test
